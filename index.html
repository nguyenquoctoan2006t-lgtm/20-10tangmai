<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bất ngờ nho nhỏ · 20/10</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Playfair+Display:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
:root{--night:#0a0f3a;--indigo:#2b2f94;--pink:#ff8fb8;--rose:#e8559a;--paper:#fff6f8;--ink:#4a2f45;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;overflow:hidden;background:var(--night);color:#fff;font-family:"Playfair Display",Georgia,serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--night);z-index:50}
#app{position:relative;height:100%;background:linear-gradient(180deg,var(--night) 0%,#1b2290 45%,#233aa8 62%,#0b1a55 100%);overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%}
.land{position:absolute;left:0;right:0;bottom:0;height:34%;pointer-events:none}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;opacity:0;pointer-events:none;transition:opacity 1.2s}
.scene.on{opacity:1;pointer-events:auto}
.cap{font-size:15px;letter-spacing:.22em;text-align:center;line-height:1.7;padding:0 24px;text-shadow:0 0 14px rgba(255,143,184,.6)}
.script{font-family:"Dancing Script",cursive,serif}
/* intro */
#s1{justify-content:center;gap:34px}
#s1 .cap{font-size:19px}
#hold{position:relative;width:92px;height:92px;border:0;border-radius:50%;background:radial-gradient(circle,rgba(255,143,184,.55),rgba(255,143,184,.08) 70%);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:pointer;color:#fff}
#hold::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--pink) var(--p,0deg),rgba(255,255,255,.2) 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px))}
#hold span{font-size:30px;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.18)}}
.hint{font-size:13px;opacity:.75;letter-spacing:.08em}
/* bloom */
#s2{justify-content:flex-start;padding-top:9vh}
#s2 h1{margin:0;font-weight:500;font-size:clamp(28px,8.5vw,40px);line-height:1.25;text-align:center;color:#d9dcff;text-shadow:0 0 18px rgba(160,170,255,.7)}
#bq{width:min(78vw,330px);margin:3vh 0 1vh;cursor:pointer;overflow:visible;filter:drop-shadow(0 8px 24px rgba(255,120,170,.35))}
.bl{transform-box:fill-box;transform-origin:50% 100%;transform:scale(0);opacity:0}
#s2.on .bl{animation:bloom 1.6s cubic-bezier(.2,.9,.3,1.2) forwards;animation-delay:var(--d)}
@keyframes bloom{to{transform:scale(1);opacity:1}}
.stem,.wrap{opacity:0;transition:opacity 1s .3s}
#s2.on .stem,#s2.on .wrap{opacity:1}
#bq.melt .bl{animation:melt 2.2s ease-in forwards;animation-delay:var(--d2)}
#bq.melt .stem,#bq.melt .wrap{opacity:0;transition:opacity 1.6s}
@keyframes melt{0%{transform:scale(1);opacity:1;filter:blur(0)}100%{transform:scale(1.9) translateY(-14%);opacity:0;filter:blur(14px)}}
#tap{position:absolute;bottom:9vh;font-size:14px;padding:11px 20px;border:1px solid rgba(255,255,255,.35);border-radius:99px;background:rgba(255,255,255,.08);backdrop-filter:blur(6px);animation:pulse 2.8s ease-in-out infinite;cursor:pointer;color:#fff;font-family:inherit}
#cap2{position:absolute;bottom:20vh;min-height:3.4em}
/* letter */
#letter{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(6,8,34,.55);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .6s;z-index:20}
#letter.on{opacity:1;pointer-events:auto}
.paper{position:relative;width:min(92vw,400px);max-height:84vh;overflow:auto;background:var(--paper);color:var(--ink);padding:30px 26px 26px;border-radius:4px 14px 6px 12px;border:2px solid #f6c5d8;box-shadow:0 20px 60px rgba(0,0,0,.5),0 0 40px rgba(255,143,184,.35);transform:rotate(-1deg) scale(.92);transition:transform .7s cubic-bezier(.2,.9,.3,1.2)}
#letter.on .paper{transform:rotate(-1deg) scale(1)}
.paper h2{margin:0 0 14px;font-size:30px;text-align:center;color:var(--rose)}
.paper p{margin:0 0 12px;font-family:"Dancing Script",cursive,serif;font-size:19px;line-height:1.55;opacity:0;animation:ln .9s forwards}
@keyframes ln{to{opacity:1}}
.paper .sg{text-align:right;color:var(--rose);font-weight:700;font-size:21px}
.x{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;border:0;background:var(--rose);color:#fff;font-size:18px;cursor:pointer}
/* gallery */
#s3{justify-content:flex-start;overflow:hidden}
#s3 .cap{position:absolute;top:64px;left:0;right:0;z-index:2;pointer-events:none}
.grid{position:absolute;inset:0}
.pc{position:absolute;left:0;top:0;margin:0;padding:6px;border-radius:12px;background:rgba(190,210,255,.16);border:1.5px solid rgba(190,215,255,.8);box-shadow:0 0 22px rgba(130,170,255,.65);cursor:grab;will-change:transform,opacity;touch-action:none;user-select:none;-webkit-user-select:none;opacity:0}
.pc img,.pc .ph{display:block;width:100%;height:100%;border-radius:8px;object-fit:cover;pointer-events:none}
.ph{background:linear-gradient(145deg,#41338f,#c25a9e);display:flex;align-items:center;justify-content:center;font-size:40px}
#add{position:absolute;bottom:calc(4vh + env(safe-area-inset-bottom,0px));left:50%;translate:-50% 0;z-index:3;margin:0;box-shadow:0 0 24px rgba(255,143,184,.5)}
/* chrome */
.fab{position:absolute;z-index:30;top:calc(10px + env(safe-area-inset-top,0px));width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);backdrop-filter:blur(6px);color:#fff;font-size:18px;cursor:pointer}
#cfg{right:12px}#re{left:12px;display:none}
#panel{position:absolute;left:0;right:0;bottom:0;z-index:40;max-height:85vh;overflow:auto;background:#141a5e;border-top:1px solid rgba(255,255,255,.25);border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .5s}
#panel.on{transform:none}
#panel label{display:block;font-size:13px;margin:12px 0 5px;opacity:.85}
#panel input[type=text],#panel textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff;font:15px/1.5 "Playfair Display",Georgia,serif}
#panel textarea{height:150px}
.btn{margin-top:16px;padding:12px 20px;border:0;border-radius:99px;background:var(--pink);color:#35103a;font:700 15px "Playfair Display",serif;cursor:pointer}
#lb{position:absolute;inset:0;z-index:45;background:rgba(5,7,30,.92);display:none;align-items:center;justify-content:center;padding:20px}
#lb.on{display:flex}#lb img{max-width:100%;max-height:88vh;border-radius:12px}
:focus-visible{outline:2px solid var(--pink);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>

<canvas id="cv"></canvas>
<svg class="land" viewBox="0 0 400 200" preserveAspectRatio="none" aria-hidden="true">
<defs><linearGradient id="mt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3f58c9"/><stop offset="1" stop-color="#1a2a82"/></linearGradient><linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14307a"/><stop offset="1" stop-color="#060b30"/></linearGradient></defs>

<h1 class="script">Happy Vietnamese<br>Women’s Day 20/10</h1>
<svg id="bq" viewBox="0 0 240 310" role="button" aria-label="Mở thư">
<defs>
<linearGradient id="pk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb4d2"/><stop offset="1" stop-color="#e8559a"/></linearGradient>

<path d="M120 236Q96 214 84 232Q96 252 120 238Q144 252 156 232Q144 214 120 236Z" fill="#ff7fb0"/>

</svg>
<div class="cap" id="cap2"></div>
<button id="tap">💌 Chạm vào bó hoa để mở thư</button>
</section>

<section class="scene" id="s3">
<div class="grid" id="grid"></div>
<button class="btn" id="add">＋ Thêm ảnh của bạn</button>
</section>

<div id="letter"><div class="paper"><button class="x" id="cl" aria-label="Đóng thư">✕</button><h2 class="script" id="to"></h2><div id="body"></div></div></div>

<div id="panel">
<strong>Tuỳ chỉnh thiệp</strong>
<label for="fTo">Gửi cho (sau chữ “Gửi”)</label><input type="text" id="fTo">
<label for="fMsg">Lời nhắn (mỗi đoạn một dòng)</label><textarea id="fMsg"></textarea>

const S={to:"Tuyết Mai",sg:"Bạn của cậu 💗",photos:[],msg:"Nhân ngày 20/10, rất muốn gửi đến cậu một bó hoa thật xinh nhưng mà xa quá nên cậu nhận đỡ món quà online này nhá kkk\nChúc cậu luôn rạng rỡ như đóa tulip mùa xuân, bình an, thật nhiều niềm vui và được yêu thương thật nhiều.\nVà cuối cùng, mong cậu quên đi những chuyện trong quá khứ để bước tiếp chặng đường mới đầy niềm vui và hạnh phúc."};
try{Object.assign(S,JSON.parse(localStorage.getItem("thiep2010c")||"{}"))}catch(e){}
S.photos=PHOTOS.slice();S.ratios=RATIOS.slice();
const save=()=>{try{localStorage.setItem("thiep2010c",JSON.stringify({to:S.to,sg:S.sg,msg:S.msg}))}catch(e){}};

/* sky */
const cv=$("#cv"),cx=cv.getContext("2d");let W,H,stars=[],fly=[],shoot=null;
function size(){const d=devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0);
stars=Array.from({length:90},()=>({x:Math.random()*W,y:Math.random()*H*.6,r:Math.random()*1.3+.3,p:Math.random()*6}));
fly=Array.from({length:34},()=>({x:Math.random()*W,y:H*.62+Math.random()*H*.38,v:Math.random()*.25+.08,p:Math.random()*6,r:Math.random()*1.6+.6}))}
function draw(t){cx.clearRect(0,0,W,H);
for(const s of stars){cx.globalAlpha=.4+.6*Math.abs(Math.sin(t/900+s.p));cx.fillStyle="#fff";cx.beginPath();cx.arc(s.x,s.y,s.r,0,7);cx.fill()}
for(const f of fly){f.y-=f.v;f.x+=Math.sin(t/1200+f.p)*.3;if(f.y<H*.55){f.y=H;f.x=Math.random()*W}
cx.globalAlpha=.35+.6*Math.abs(Math.sin(t/700+f.p));cx.fillStyle="#ffe6a8";cx.shadowColor="#ffd27a";cx.shadowBlur=10;cx.beginPath();cx.arc(f.x,f.y,f.r,0,7);cx.fill();cx.shadowBlur=0}
if(!shoot&&Math.random()<.004)shoot={x:Math.random()*W*.8,y:Math.random()*H*.25,l:0};
if(shoot){cx.globalAlpha=1-shoot.l/60;cx.strokeStyle="#fff";cx.lineWidth=1.5;cx.beginPath();cx.moveTo(shoot.x,shoot.y);cx.lineTo(shoot.x-40,shoot.y-18);cx.stroke();shoot.x+=6;shoot.y+=2.7;if(++shoot.l>60)shoot=null}
requestAnimationFrame(draw)}
addEventListener("resize",size);size();requestAnimationFrame(draw);

/* scenes */
const sc=["s1","s2","s3"];
function go(n){sc.forEach((id,i)=>$("#"+id).classList.toggle("on",i===n));$("#re").style.display=n===2?"block":"none";
if(n===1){$("#bq").classList.remove("melt");type("20/10 LUÔN VUI VẺ NHA")}
if(n!==2)cancelAnimationFrame(fraf);if(n===2)render()}
let tm;function type(t){clearTimeout(tm);const el=$("#cap2");el.textContent="";let i=0;(function f(){el.textContent=t.slice(0,++i);if(i<t.length)tm=setTimeout(f,110)})()}

/* hold to open */
const hb=$("#hold");let hold=0,holding=false,last=0,raf=0;
function tick(t){const dt=Math.min(t-last,50);last=t;hold+=holding?dt/1400:-dt/700;hold=Math.max(0,Math.min(1,hold));hb.style.setProperty("--p",hold*360+"deg");
if(hold>=1){holding=false;hold=0;hb.style.setProperty("--p","0deg");go(1);return}if(hold>0||holding)raf=requestAnimationFrame(tick)}
hb.addEventListener("pointerdown",e=>{e.preventDefault();holding=true;last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(tick)});
["pointerup","pointerleave","pointercancel"].forEach(v=>hb.addEventListener(v,()=>holding=false));
hb.addEventListener("contextmenu",e=>e.preventDefault());
hb.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" ")go(1)});

/* letter */
function openLetter(){$("#to").textContent="Gửi "+S.to+",";const b=$("#body");b.innerHTML="";
const ps=S.msg.split("\n").filter(Boolean);ps.forEach((t,i)=>{const p=document.createElement("p");p.textContent=t;p.style.animationDelay=(.6+i*1.1)+"s";b.appendChild(p)});
const g=document.createElement("p");g.className="sg";g.textContent=S.sg;g.style.animationDelay=(.6+ps.length*1.1)+"s";b.appendChild(g);
$("#letter").classList.add("on")}
$("#bq").addEventListener("click",openLetter);$("#tap").addEventListener("click",openLetter);
$("#cl").addEventListener("click",()=>{$("#letter").classList.remove("on");$("#bq").classList.add("melt");setTimeout(()=>go(2),2600)});
$("#re").addEventListener("click",()=>go(0));

/* gallery */
let cards=[],fraf=0,drag=null;const rm=matchMedia("(prefers-reduced-motion:reduce)").matches;
function render(){const g=$("#grid");cancelAnimationFrame(fraf);g.innerHTML="";cards=[];
const w=g.clientWidth||innerWidth,h=g.clientHeight||innerHeight,items=S.photos.length?S.photos:Array(8).fill(null),n=items.length;
items.forEach((src,i)=>{const cw=Math.round(Math.min(w,520)*(.27+Math.random()*.1)),ch=Math.round(cw*Math.min(1.6,Math.max(.8,(S.ratios&&S.ratios[i])||1.05+Math.random()*.3))),d=document.createElement("figure");
d.className="pc";d.style.width=cw+"px";d.style.height=ch+"px";
if(src){const im=new Image();im.src=src;im.alt="Ảnh kỷ niệm";d.appendChild(im)}else d.innerHTML='<div class="ph">🌷</div>';
g.appendChild(d);
const c={d,src,h:ch,bx:((i%3)+.5)/3*w-cw/2+(Math.random()-.5)*20,y:(i/n)*(h+ch)-ch*.4,vy:.18+Math.random()*.22,ph:Math.random()*6,sp:.0006+Math.random()*.0006,r:(Math.random()-.5)*10,ox:0};
cards.push(c);
d.addEventListener("pointerdown",e=>{drag={c,sx:e.clientX,sy:e.clientY,ox:c.ox,y:c.y,moved:false};d.setPointerCapture(e.pointerId);d.style.zIndex=5});
d.addEventListener("pointermove",e=>{if(!drag||drag.c!==c)return;const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;if(Math.abs(dx)+Math.abs(dy)>6)drag.moved=true;if(drag.moved){c.ox=drag.ox+dx;c.y=drag.y+dy}});
d.addEventListener("pointerup",()=>{if(drag&&drag.c===c){if(!drag.moved){if(c.src){$("#lb img").src=c.src;$("#lb").classList.add("on")}else openPanel()}d.style.zIndex="";drag=null}});
d.addEventListener("pointercancel",()=>{drag=null;d.style.zIndex=""})});
(function loop(t){for(const c of cards){if(!rm&&!(drag&&drag.c===c)){c.y-=c.vy;if(c.y<-c.h-10)c.y=h+10}
const k=rm?0:1,sway=Math.sin(t*c.sp+c.ph)*16*k,rot=c.r+Math.sin(t*c.sp*1.3+c.ph)*4*k;
c.d.style.transform="translate("+(c.bx+c.ox+sway)+"px,"+c.y+"px) rotate("+rot+"deg)";
c.d.style.opacity=Math.max(0,Math.min(1,(h-c.y)/70,(c.y+c.h)/70))}
fraf=requestAnimationFrame(loop)})(performance.now())}
$("#add").onclick=openPanel;
$("#lb").onclick=()=>$("#lb").classList.remove("on");

/* customise */
function openPanel(){$("#fTo").value=S.to;$("#fMsg").value=S.msg;$("#fSg").value=S.sg;$("#panel").classList.add("on")}
$("#cfg").onclick=openPanel;
$("#done").onclick=()=>{S.to=$("#fTo").value.trim()||S.to;S.msg=$("#fMsg").value.trim()||S.msg;S.sg=$("#fSg").value.trim()||S.sg;save();$("#panel").classList.remove("on");if($("#s3").classList.contains("on"))render()};
$("#fPh").onchange=async e=>{for(const f of e.target.files){await new Promise(ok=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,640/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);S.photos.push(c.toDataURL("image/jpeg",.8));ok()};im.onerror=ok;im.src=r.result};r.onerror=ok;r.readAsDataURL(f)})}
if($("#s3").classList.contains("on"))render()};
</script>
